name: Biome Lint Check
on: [pull_request]
jobs:
  biome:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Run Biome with Reviewdog
        uses: mongolyy/reviewdog-action-biome@v2
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_level: error
      - name: Run tsc with Reviewdog
        uses: lowlydba/tsc-check@v1.3.1
        with:
          typescript-version: 6.0.3
          reporter: github-pr-review
          level: error
          tsc-flags: "--noEmit --skipLibCheck"
