global:
  scrape_interval: 15s

# Baseline alerting (aeroswarm-project/docs/audit/tasks/009-*.md) — see
# alerts.rules.yml for why this is intentionally minimal for now.
rule_files:
  - "alerts.rules.yml"

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:8080']

  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:3004']

  - job_name: user-service
    static_configs:
      - targets: ['user-service:3002']

  # connection-service is the literal federation ingest/history endpoint
  # (apps/connection-service/src/app.ts exposes /metrics) — previously
  # missing here entirely, so its own health/throughput was invisible to
  # Prometheus. worker-service and alert-service were the same gap.
  #
  # connection-service and alert-service both default to port 3005
  # (CONNECTION_SERVICE_PORT / ALERT_SERVICE_PORT in .env.example) — this
  # looks like a collision but isn't one: they're separate containers on the
  # compose network, each with their own DNS name, and only
  # connection-service publishes its port to the host (see docker-compose.yml).
  # Two containers listening on the same internal port number is fine;
  # Prometheus reaches them as distinct targets by hostname regardless.
  - job_name: connection-service
    static_configs:
      - targets: ['connection-service:3005']

  - job_name: worker-service
    static_configs:
      - targets: ['worker-service:3003']

  - job_name: alert-service
    static_configs:
      - targets: ['alert-service:3005']
