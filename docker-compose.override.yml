version: "3.8"

services:
  redis:
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: backend-djuanda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backend_djuanda}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backend_djuanda}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgbouncer:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: backend-djuanda-postgres-data
