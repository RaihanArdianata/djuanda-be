services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST:?set DB_HOST ke alamat VPS database di .env}:${DB_PORT:-5432}/${POSTGRES_DB:-backend_djuanda}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"

  redis:
    image: redis:7-alpine
    container_name: backend-djuanda-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Host 9090 is already held by a native (non-Docker) Prometheus
      # process on the VPS (pid 943 as of 2026-07-24) — unrelated to either
      # app, left alone rather than touched. Remapped to 9091 on the host
      # side only; the container still listens on 9090 internally, so
      # nothing inside the compose network (e.g. Grafana, if ever pointed
      # at this instance) needs to change.
      - "9091:9090"

  # Ingest broker for AeroSwarm's kafka connector — low-latency, buffered
  # delivery of fused tracks/alerts (an alternative to the http webhook /
  # low-latency websocket connectors, see docs/asmgcs/004-*.md). Producer =
  # AeroSwarm's process-service (may run on a different host); consumer =
  # connection-service (below).
  #
  # ADVERTISED_KAFKA_HOST must be an address the PRODUCER can actually reach
  # (this VPS's LAN/public IP or DNS name) — "localhost" only works for
  # same-machine clients. Set it in .env; the dual-listener setup below
  # (PLAINTEXT for containers on this compose network, OUTSIDE for everyone
  # else) mirrors aeroswarm-project's own redpanda service.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: backend-djuanda-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092,TUNNEL://0.0.0.0:19093
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://${ADVERTISED_KAFKA_HOST:?set ADVERTISED_KAFKA_HOST in .env — the address AeroSwarm's producer can reach}:19092,TUNNEL://${ADVERTISED_KAFKA_HOST}:19093
    ports:
      - "19092:19092"
      - "19093:19093"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk cluster info --brokers localhost:9092 > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
        reservations:
          memory: 512M

  # Creates the ingest topic with retention bounded from day one — a bare
  # `rpk topic create` without --config leaves Redpanda's default (7 days,
  # unbounded bytes), which is exactly what silently filled AeroSwarm's own
  # VPS disk before its retention was fixed. Don't repeat that here.
  redpanda-init:
    image: redpandadata/redpanda:latest
    container_name: backend-djuanda-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Converge every topic to bounded retention — size AND time — so the
        # 40GB root disk can't fill up. Anything that persists to Postgres
        # (tracks, alerts, movements) doesn't need long Kafka retention;
        # consumers are near-realtime. Worst-case Kafka footprint here is
        # ~3.3GB.
        converge() {
          topic=$$1; retention_ms=$$2; retention_bytes=$$3
          rpk topic create "$$topic" \
            --brokers redpanda:9092 \
            --partitions 3 \
            --replicas 1 \
            --config retention.ms=$$retention_ms \
            --config retention.bytes=$$retention_bytes \
            --config compression.type=lz4 \
            || true
          # Topic may already exist from a prior deploy with stale (default
          # 7-day, unbounded) retention — force-converge every startup.
          rpk topic alter-config "$$topic" \
            --brokers redpanda:9092 \
            --set retention.ms=$$retention_ms \
            --set retention.bytes=$$retention_bytes \
            --set compression.type=lz4 \
            || true
        }

        # Raw ingest firehose — transient buffer, replay not needed.
        converge ${AEROSWARM_INGEST_KAFKA_TOPIC:-aeroswarm.ingest.warr} 3600000 536870912
        converge aeroswarm.ingest.example 3600000 268435456

        # Track updates -> alert-service live pipeline (playback reads
        # aeroswarm_tracks in Postgres, not this topic).
        converge ${AEROSWARM_TRACK_KAFKA_TOPIC:-asmgcs.tracks} 86400000 1073741824

        # Alert lifecycle -> notification-service; alerts also persist to
        # the alerts table, so 3d Kafka history is ample for replay/debug.
        converge ${ALERT_KAFKA_ALERT_TOPIC:-asmgcs.alerts} 259200000 1073741824

        # Service-to-service movement event bus (connection-service ->
        # statistics-service), durable/replayable, consumer-group based.
        converge ${KAFKA_MOVEMENT_TOPIC:-asmgcs.movement} 259200000 268435456

        # Latest-state / low-volume event feeds for alert-service context
        # consumers — a day of history is already generous.
        converge ${ALERT_KAFKA_WEATHER_TOPIC:-asmgcs.weather} 86400000 67108864
        converge ${ALERT_KAFKA_ADVISORY_TOPIC:-asmgcs.advisory} 86400000 67108864
        converge ${ALERT_KAFKA_AERODROME_TOPIC:-asmgcs.aerodrome} 86400000 67108864

        # Cluster-level fallback — any topic auto-created later (missed by the
        # list above) still inherits bounded retention instead of Redpanda's
        # unlimited default. Topic-level configs above win where set.
        rpk cluster config set log_retention_ms 86400000 --brokers redpanda:9092 || true
        rpk cluster config set retention_bytes 1073741824 --brokers redpanda:9092 || true

        echo "Topics created/converged."
    restart: "no"

  auth-service:
    build:
      context: .
      args:
        APP_DIR: auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_SERVICE_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: .
      args:
        APP_DIR: notification-service
    restart: unless-stopped
    env_file: .env
    environment:
      NOTIFICATION_SERVICE_PORT: "3004"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build:
      context: .
      args:
        APP_DIR: user-service
    restart: unless-stopped
    env_file: .env
    environment:
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-3002}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  connection-service:
    build:
      context: .
      args:
        APP_DIR: connection-service
    restart: unless-stopped
    env_file: .env
    environment:
      CONNECTION_SERVICE_PORT: ${CONNECTION_SERVICE_PORT:-3005}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      # Kafka ingest consumer (alternative to http/websocket — see
      # docs/asmgcs/004-*.md). Unset AEROSWARM_INGEST_KAFKA_BROKERS to run
      # without it; the http/websocket ingest paths are unaffected either way.
      AEROSWARM_INGEST_KAFKA_BROKERS: ${AEROSWARM_INGEST_KAFKA_BROKERS:-redpanda:9092}
      AEROSWARM_INGEST_KAFKA_TOPIC: ${AEROSWARM_INGEST_KAFKA_TOPIC:-aeroswarm.ingest.warr}
      AEROSWARM_INGEST_KAFKA_GROUP_ID: connection-service
      # Outbound: fused tracks -> asmgcs.tracks untuk alert-service
      AEROSWARM_TRACK_KAFKA_BROKERS: ${AEROSWARM_TRACK_KAFKA_BROKERS:-redpanda:9092}
      AEROSWARM_TRACK_KAFKA_TOPIC: ${AEROSWARM_TRACK_KAFKA_TOPIC:-asmgcs.tracks}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_MOVEMENT_TOPIC: ${KAFKA_MOVEMENT_TOPIC:-asmgcs.movement}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
        # Soft: the http/websocket ingest paths don't need Kafka — a
        # Redpanda hiccup shouldn't take connection-service down with it.
        required: false
      redis:
        condition: service_healthy
    # Exposed directly (not via gateway): AeroSwarm's http connector POSTs
    # ingest here, and the AeroSwarm dashboard connects here for this
    # airport's replay/history (client-side federation). Host port follows
    # CONNECTION_SERVICE_PORT — kalau kamu ganti port di .env, connector
    # AeroSwarm & history_endpoint airport juga harus diarahkan ke port baru.
    ports:
      - "${CONNECTION_SERVICE_PORT:-3005}:${CONNECTION_SERVICE_PORT:-3005}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker-service:
    build:
      context: .
      args:
        APP_DIR: worker-service
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_SERVICE_PORT: ${WORKER_SERVICE_PORT:-3003}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${WORKER_SERVICE_PORT:-3003}:${WORKER_SERVICE_PORT:-3003}"

  alert-service:
    container_name: backend-djuanda-alert-service
    build:
      context: .
      args:
        APP_DIR: alert-service
    restart: unless-stopped
    env_file: .env
    environment:
      ALERT_SERVICE_PORT: ${ALERT_SERVICE_PORT:-3006}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ALERT_KAFKA_BROKERS: redpanda:9092
      AERODROME_SERVICE_URL: http://aerodrome-service:${AERODROME_SERVICE_PORT:-3009}
      STATISTICS_SERVICE_URL: http://gateway:8080
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch(`http://localhost:$${process.env.ALERT_SERVICE_PORT || 3006}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  # METAR/TAF polling for WARR (or whichever station is set via
  # WEATHER_STATION_ICAO) — see src/modules/weather/scheduler for the
  # node-cron polling logic. Only accessed via the gateway, same as
  # user-service/alert-service; not exposed on the host.
  weather-service:
    container_name: backend-djuanda-weather-service
    build:
      context: .
      args:
        APP_DIR: weather-service
    restart: unless-stopped
    env_file: .env
    environment:
      WEATHER_SERVICE_PORT: ${WEATHER_SERVICE_PORT:-3008}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  advisory-service:
    container_name: backend-djuanda-advisory-service
    build:
      context: .
      args:
        APP_DIR: advisory-service
    restart: unless-stopped
    env_file: .env
    environment:
      ADVISORY_SERVICE_PORT: ${ADVISORY_SERVICE_PORT:-3007}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3007/advisory/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Aerodrome mapping data (layers/features/import/export, GeoJSON) — only
  aerodrome-service:
    container_name: backend-djuanda-aerodrome-service
    build:
      context: .
      args:
        APP_DIR: aerodrome-service
    restart: unless-stopped
    env_file: .env
    environment:
      AERODROME_SERVICE_PORT: ${AERODROME_SERVICE_PORT:-3009}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3009/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  statistics-service:
    build:
      context: .
      args:
        APP_DIR: statistics-service
    restart: unless-stopped
    env_file: .env
    environment:
      STATISTICS_SERVICE_PORT: ${STATISTICS_SERVICE_PORT:-3010}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_MOVEMENT_TOPIC: ${KAFKA_MOVEMENT_TOPIC:-asmgcs.movement}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  playback-service:
    container_name: backend-djuanda-playback-service
    build:
      context: .
      args:
        APP_DIR: playback-service
    restart: unless-stopped
    env_file: .env
    environment:
      PLAYBACK_SERVICE_PORT: ${PLAYBACK_SERVICE_PORT:-3011}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-backend_djuanda}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      args:
        APP_DIR: gateway
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      USER_SERVICE_URL: http://user-service:${USER_SERVICE_PORT:-3002}
      ALERT_SERVICE_URL: http://alert-service:${ALERT_SERVICE_PORT:-3006}
      WEATHER_SERVICE_URL: http://weather-service:${WEATHER_SERVICE_PORT:-3008}
      ADVISORY_SERVICE_URL: http://advisory-service:${ADVISORY_SERVICE_PORT:-3007}
      WS_SERVICE_URL: http://worker-service:${WORKER_SERVICE_PORT:-3003}/ws
      SSE_SERVICE_URL: http://worker-service:${WORKER_SERVICE_PORT:-3003}/sse
      AERODROME_SERVICE_URL: http://aerodrome-service:${AERODROME_SERVICE_PORT:-3009}
      STATISTICS_SERVICE_URL: http://statistics-service:${STATISTICS_SERVICE_PORT:-3010}
      PLAYBACK_SERVICE_URL: http://playback-service:${PLAYBACK_SERVICE_PORT:-3011}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      aerodrome-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  prometheus-data:
  redpanda-data:
    name: backend-djuanda-redpanda-data