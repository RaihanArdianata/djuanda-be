name: Deploy Backend Djuanda

on:
  push:
    branches:
      - development

jobs:
  deploy:
    concurrency:
      group: backend-djuanda-production
      cancel-in-progress: true
    runs-on: [self-hosted, kantor-231]
    timeout-minutes: 30

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/apps/backend-djuanda' }}

    steps:
      - name: Resolve deploy path
        run: |
          RESOLVED="${DEPLOY_PATH/#\~/$HOME}"
          echo "DEPLOY_PATH=$RESOLVED" >> "$GITHUB_ENV"

      - name: Sync latest code
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          git fetch --all
          git reset --hard origin/development
          git clean -fd

      - name: Verify environment
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          if [ ! -f .env ]; then
            echo "FATAL: .env file not found at $(pwd)/.env"
            exit 1
          fi
          for var in JWT_SECRET DATABASE_URL DB_HOST POSTGRES_PASSWORD; do
            val=$(grep "^${var}=" .env | cut -d'=' -f2-)
            if [ -z "$val" ] || echo "$val" | grep -qi "change-me"; then
              echo "FATAL: $var is missing or still has a placeholder value"
              exit 1
            fi
          done
          echo "Environment OK"

      - name: Build images
        working-directory: ${{ env.DEPLOY_PATH }}
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose build --pull

      - name: Run database migrations
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          # Tidak ada container postgres lokal -- DB-nya di VPS terpisah. pgbouncer
          # yang jadi perantara, jadi cukup tunggu itu jalan lalu coba migrate
          # (retry beberapa kali kalau jaringan ke VPS DB belum siap).
          # --force-recreate: `up -d` alone doesn't reliably recreate a
          # container just because an interpolated env value (from .env)
          # changed -- Compose's config-diff can miss that, leaving pgbouncer
          # running with a stale baked-in DATABASE_URL (symptom: its logs
          # show a fallback host/db/user instead of the real DB_HOST/POSTGRES_*).
          docker compose up -d --force-recreate pgbouncer

          echo "--- pgbouncer status ---"
          docker compose ps pgbouncer

          # Migrasi HARUS lewat koneksi langsung ke Postgres, bukan pgbouncer
          # (POOL_MODE: transaction) -- drizzle-kit mengambil advisory lock
          # sesi sebelum apply migrations, dan transaction pooling bisa
          # menukar koneksi fisik antar statement sehingga lock/prepared
          # statement tidak konsisten (gejalanya: hang lama lalu gagal, bukan
          # connection-refused instan). .env sudah punya DATABASE_URL yang
          # benar (langsung ke VPS DB) -- override eksplisit di sini supaya
          # tidak diam-diam ketiban DATABASE_URL milik container auth-service
          # (docker-compose.yml mengarahkannya ke pgbouncer:6432).
          DIRECT_DATABASE_URL=$(grep '^DATABASE_URL=' .env | cut -d'=' -f2-)
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "FATAL: DATABASE_URL tidak ditemukan di .env"
            exit 1
          fi

          for i in $(seq 1 10); do
            # drizzle-kit's spinner redraws the same line with \r -- GitHub
            # Actions' live log view collapses that and hides whatever error
            # text follows it. Capture to a file and `cat` it afterward
            # instead of watching the command run live, so nothing gets
            # overwritten.
            if docker compose run --rm --no-deps -e DATABASE_URL="$DIRECT_DATABASE_URL" auth-service \
              sh -c "cd ../../packages/database && bun run db:migrate > /tmp/migrate.log 2>&1; ec=\$?; tr '\r' '\n' < /tmp/migrate.log; exit \$ec"; then
              echo "Migrations done"
              break
            fi
            [ $i -eq 10 ] && {
              echo "Migration failed after 10 attempts (cek koneksi ke DB VPS: DB_HOST/DB_PORT/POSTGRES_USER/POSTGRES_PASSWORD di .env, firewall, pg_hba.conf)"
              echo "--- pgbouncer logs ---"
              docker compose logs pgbouncer --tail=50
              exit 1
            }
            echo "  migrate attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Deploy
        working-directory: ${{ env.DEPLOY_PATH }}
        run: docker compose up -d

      - name: Wait for gateway healthy
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          for i in $(seq 1 18); do
            status=$(docker inspect backend-djuanda-gateway-1 --format='{{.State.Health.Status}}' 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              echo "gateway is healthy"
              break
            fi
            [ $i -eq 18 ] && { echo "gateway did not become healthy"; docker compose logs gateway --tail=30; }
            sleep 10
          done
          docker compose ps

      - name: Cleanup old images
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          docker image prune -af
          docker builder prune -f
